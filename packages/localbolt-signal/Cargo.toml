[package]
name = "localbolt-signal"
version = "0.1.1"
edition = "2021"
description = "WebSocket signaling server for LocalBolt P2P file transfer (canonical bolt-rendezvous wrapper)"

[dependencies]
bolt-rendezvous = { git = "https://github.com/the9ines/bolt-rendezvous", tag = "rendezvous-v0.2.2-s0-canonical-lib-verified" }
tokio = { version = "1", features = ["full"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
bolt-core = { path = "../../../bolt-core-sdk/rust/bolt-core" }
tokio = { version = "1", features = ["test-util", "macros", "rt"] }
serde_json = "1"
