name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  signal-server:
    name: Signal Server (Rust)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/localbolt-signal
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
      - uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2
        with:
          workspaces: packages/localbolt-signal
      - run: cargo fmt --check
      - run: cargo clippy -- -D warnings
      - run: cargo test
      - run: cargo build --release

  web-app:
    name: Web App (TypeScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
      - name: Registry mapping guard (D5)
        run: bash scripts/check-registry-mapping.sh
      - run: npm ci
      - name: Lockfile registry guard (D5)
        run: bash scripts/check-lockfile-registry.sh
      - name: Build workspace (bolt-core-browser → localbolt-browser → localbolt-core → localbolt-web)
        run: npm run build
      - name: Test localbolt-browser
        run: npm test -w packages/localbolt-browser
      - name: Test localbolt-core
        run: npm test -w packages/localbolt-core
      - name: Test localbolt-web
        run: npm test -w packages/localbolt-web -- --coverage
      - name: Core drift guard
        run: bash scripts/check-core-drift.sh packages/localbolt-web/src
